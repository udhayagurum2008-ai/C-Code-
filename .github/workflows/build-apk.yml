name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Android project
        shell: python
        run: |
          import pathlib, shutil
          root = pathlib.Path("android-app")
          assets = root / "app/src/main/assets"
          java_dir = root / "app/src/main/java/com/udhayaguru/ccodelab"
          assets.mkdir(parents=True, exist_ok=True)
          java_dir.mkdir(parents=True, exist_ok=True)
          for f in ["index.html", "manifest.webmanifest", "sw.js"]:
              if pathlib.Path(f).exists():
                  shutil.copy(f, assets / f)
          (root / "settings.gradle").write_text("\n".join([
              "pluginManagement {",
              "    repositories {",
              "        google()",
              "        mavenCentral()",
              "        gradlePluginPortal()",
              "    }",
              "}",
              "dependencyResolutionManagement {",
              "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)",
              "    repositories {",
              "        google()",
              "        mavenCentral()",
              "    }",
              "}",
              "rootProject.name = 'CCodeLab'",
              "include ':app'"
          ]))
          (root / "build.gradle").write_text("\n".join([
              "plugins {",
              "    id 'com.android.application' version '8.5.2' apply false",
              "}"
          ]))
          (root / "gradle.properties").write_text("\n".join([
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8",
              "android.useAndroidX=true"
          ]))
          (root / "app/build.gradle").write_text("\n".join([
              "plugins {",
              "    id 'com.android.application'",
              "}",
              "android {",
              "    namespace 'com.udhayaguru.ccodelab'",
              "    compileSdk 34",
              "    defaultConfig {",
              "        applicationId 'com.udhayaguru.ccodelab'",
              "        minSdk 23",
              "        targetSdk 34",
              "        versionCode 1",
              "        versionName '1.0'",
              "    }",
              "    compileOptions {",
              "        sourceCompatibility JavaVersion.VERSION_17",
              "        targetCompatibility JavaVersion.VERSION_17",
              "    }",
              "}"
          ]))
          L, R = chr(60), chr(62)
          (root / "app/src/main/AndroidManifest.xml").write_text("\n".join([
              f'{L}manifest xmlns:android="http://schemas.android.com/apk/res/android"{R}',
              f'    {L}uses-permission android:name="android.permission.INTERNET"/{R}',
              f'    {L}application android:label="C Code Lab" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"{R}',
              f'        {L}activity android:name=".MainActivity" android:exported="true"{R}',
              f'            {L}intent-filter{R}',
              f'                {L}action android:name="android.intent.action.MAIN"/{R}',
              f'                {L}category android:name="android.intent.category.LAUNCHER"/{R}',
              f'            {L}/intent-filter{R}',
              f'        {L}/activity{R}',
              f'    {L}/application{R}',
              f'{L}/manifest{R}'
          ]))
          (java_dir / "MainActivity.java").write_text("\n".join([
              "package com.udhayaguru.ccodelab;",
              "import android.app.Activity;",
              "import android.os.Bundle;",
              "import android.webkit.WebView;",
              "import android.webkit.WebViewClient;",
              "import android.webkit.WebChromeClient;",
              "public class MainActivity extends Activity {",
              "    private WebView web;",
              "    @Override",
              "    protected void onCreate(Bundle savedInstanceState) {",
              "        super.onCreate(savedInstanceState);",
              "        web = new WebView(this);",
              "        web.getSettings().setJavaScriptEnabled(true);",
              "        web.getSettings().setDomStorageEnabled(true);",
              "        web.getSettings().setAllowFileAccess(true);",
              "        web.setWebViewClient(new WebViewClient());",
              "        web.setWebChromeClient(new WebChromeClient());",
              "        setContentView(web);",
              '        web.loadUrl("file:///android_asset/index.html");',
              "    }",
              "}"
          ]))

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Code-Lab-Android-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
