name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate icon.svg and setup Android project
        run: |
          cat << 'EOF' > setup_project.py
import os, shutil

icon_content = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#007acc" rx="20"/>
  <text x="50" y="65" font-size="50" font-weight="bold" fill="white" text-anchor="middle">C</text>
</svg>'''

with open("icon.svg", "w", encoding="utf-8") as f:
    f.write(icon_content.strip())

base_dir = "android-app"
os.makedirs(os.path.join(base_dir, "app", "src", "main", "java", "com", "udhayaguru", "ccodelab"), exist_ok=True)
os.makedirs(os.path.join(base_dir, "app", "src", "main", "res", "values"), exist_ok=True)
os.makedirs(os.path.join(base_dir, "app", "src", "main", "assets"), exist_ok=True)

for asset in ["index.html", "manifest.webmanifest", "sw.js"]:
    if os.path.exists(asset):
        shutil.copy(asset, os.path.join(base_dir, "app", "src", "main", "assets", asset))

with open(os.path.join(base_dir, "settings.gradle.kts"), "w", encoding="utf-8") as f:
    f.write("""pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "C-Code-Lab"
include(":app")
""")

with open(os.path.join(base_dir, "build.gradle.kts"), "w", encoding="utf-8") as f:
    f.write("""plugins {
    id("com.android.application") version "8.7.2" apply false
}
""")

with open(os.path.join(base_dir, "gradle.properties"), "w", encoding="utf-8") as f:
    f.write("""org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
""")

with open(os.path.join(base_dir, "app", "build.gradle.kts"), "w", encoding="utf-8") as f:
    f.write("""plugins {
    id("com.android.application")
}

android {
    namespace = "com.udhayaguru.ccodelab"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.udhayaguru.ccodelab"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            isMinifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.webkit:webkit:1.12.0")
}
""")

with open(os.path.join(base_dir, "app", "src", "main", "AndroidManifest.xml"), "w", encoding="utf-8") as f:
    f.write("""<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <application
        android:allowBackup="true"
        android:label="C-Code Lab"
        android:supportsRtl="true"
        android:theme="@style/Theme.CCodeLab">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
""")

with open(os.path.join(base_dir, "app", "src", "main", "res", "values", "styles.xml"), "w", encoding="utf-8") as f:
    f.write("""<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="Theme.CCodeLab" parent="Theme.AppCompat.Light.NoActionBar">
    </style>
</resources>
""")

with open(os.path.join(base_dir, "app", "src", "main", "java", "com", "udhayaguru", "ccodelab", "MainActivity.java"), "w", encoding="utf-8") as f:
    f.write("""package com.udhayaguru.ccodelab;

import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        WebView webView = new WebView(this);
        setContentView(webView);

        WebSettings webSettings = webView.getSettings();
        webSettings.setJavaScriptEnabled(true);
        webSettings.setDomStorageEnabled(true);
        webSettings.setAllowFileAccess(true);
        webSettings.setAllowContentAccess(true);

        webView.setWebViewClient(new WebViewClient());
        webView.loadUrl("file:///android_asset/index.html");
    }
}
""")
EOF
          python3 setup_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/C-Code-Lab.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-Code-Lab-Android-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
