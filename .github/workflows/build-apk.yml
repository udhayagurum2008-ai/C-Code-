name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate icon.svg and setup Android project
        run: |
          python3 -c "
          import os, shutil

          with open('icon.svg', 'w') as f:
              f.write('<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#007acc\" rx=\"20\"/><text x=\"50\" y=\"65\" font-size=\"50\" font-weight=\"bold\" fill=\"white\" text-anchor=\"middle\">C</text></svg>')

          base = 'android-app'
          os.makedirs(os.path.join(base, 'app/src/main/java/com/udhayaguru/ccodelab'), exist_ok=True)
          os.makedirs(os.path.join(base, 'app/src/main/res/values'), exist_ok=True)
          os.makedirs(os.path.join(base, 'app/src/main/assets'), exist_ok=True)

          for a in ['index.html', 'manifest.webmanifest', 'sw.js']:
              if os.path.exists(a):
                  shutil.copy(a, os.path.join(base, 'app/src/main/assets', a))

          with open(os.path.join(base, 'settings.gradle.kts'), 'w') as f:
              f.write('pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); m        f.write('pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\n\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\n\nrootProject.name = "C-Code"\ninclude(":app")\n')avenCentral() } }\nrootProject.name = \"C-Code-Lab\"\ninclude(\":app\")\n')

          with open(os.path.join(base, 'build.gradle.kts'), 'w') as f:
              f.write('plugins { id(\"com.android.application\") version \"8.7.2\" apply false }\n')

          with open(os.path.join(base, 'gradle.properties'), 'w') as f:
              f.write('org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n')

          with open(os.path.join(base, 'app/build.gradle.kts'), 'w') as f:
              f.write('plugins { id(\"com.android.application\") }\nandroid { namespace = \"com.udhayaguru.ccodelab\"\ncompileSdk = 34\ndefaultConfig { applicationId = \"com.udhayaguru.ccodelab\"\nminSdk = 24\ntargetSdk = 34\nversionCode = 1\nversionName = \"1.0\" }\ncompileOptions { sourceCompatibility = JavaVersion.VERSION_17\ntargetCompatibility = JavaVersion.VERSION_17 } }\nconfigurations.all { resolutionStrategy.capabilitiesResolution.withCapability(\"org.jetbrains.kotlin:kotlin-stdlib-jdk8\") { select(\"org.jetbrains.kotlin:kotlin-stdlib:0\") } }\ndependencies { implementation(\"androidx.appcompat:appcompat:1.7.0\") { exclude(group = \"org.jetbrains.kotlin\", module = \"kotlin-stdlib-jdk8\") exclude(group = \"org.jetbrains.kotlin\", module = \"kotlin-stdlib-jdk7\") }\nimplementation(\"androidx.webkit:webkit:1.12.0\") { exclude(group = \"org.jetbrains.kotlin\", module = \"kotlin-stdlib-jdk8\") excludef.write('plugins {\n  id("com.android.application")\n}\n\nandroid {\n  namespace = "com.udhayaguru.ccodelab"\n  compileSdk = 34\n\n  defaultConfig {\n    applicationId = "com.udhayaguru.ccodelab"\n    minSdk = 24\n    targetSdk = 34\n    versionCode = 1\n    versionName = "1.0"\n  }\n\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n}\n\ndependencies {\n  implementation("androidx.appcompat:appcompat:1.7.0")\n  implementation("com.google.android.material:material:1.12.0")\n  implementation("androidx.webkit:webkit:1.12.0") {\n    exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk8")\n    exclude(group = "org.jetbrains.kotlin", module = "kotlin-stdlib-jdk7")\n  }\n}\n')(group = \"org.jetbrains.kotlin\", module = \"kotlin-stdlib-jdk7\") } }\n')

          with open(os.path.join(base, 'app/src/main/AndroidManifest.xml'), 'w') as f:
              f.write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n<uses-permission android:name=\"android.permission.INTERNET\" />\n<application android:allowBackup=\"true\" android:label=\"C-Code Lab\" android:supportsRtl=\"true\" android:theme=\"@style/Theme.CCodeLab\">\n<activity android:name=\".MainActivity\" android:exported=\"true\">\n<intent-filter>\n<action android:name=\"android.intent.action.MAIN\" />\n<category android:name=\"android.intent.category.LAf.write('<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n<uses-permission android:name="android.permission.INTERNET" />\n<application android:allowBackup="true" android:label="C-Code" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">\n<activity android:name=".MainActivity" android:exported="true">\n<intent-filter>\n<action android:name="android.intent.action.MAIN" />\n<category android:name="android.intent.category.LAUNCHER" />\n</intent-filter>\n</activity>\n</application>\n</manifest>\n')UNCHER\" />\n</intent-filter>\n</activity>\n</application>\n</manifest>\n')

          with open(os.path.join(base, 'app/src/main/res/values/styles.xml'), 'w') as f:
              f.write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n<style name=\"Theme.CCodeLab\" parent=\"Theme.AppCompat.Light.NoActionBar\">\n</style>\n</resources>\n')

          with open(os.path.join(base, 'app/src/main/java/com/udhayaguru/ccodelab/MainActivity.java'), 'w') as f:
              f.write('package com.udhayaguru.ccodelab;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\nsuper.onCreate(savedInstanceState);\nWebView webView = new WebView(this);\nsetContentView(webView);\nWebSettings webSettings = webView.getSettings();\nwebSettings.setJavaScriptEnabled(true);\nwebSettings.setDomStorageEnabled(true);\nwebSettings.setAllowFileAccess(true);\nwebSettings.setAllowContentAccess(true);\nwebView.setWebViewClient(new WebViewCf.write('package com.udhayaguru.ccodelab;\nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\nsuper.onCreate(savedInstanceState);\nWebView webView = new WebView(this);\nwebView.getSettings().setJavaScriptEnabled(true);\nwebView.setWebViewClient(new WebViewClient());\nwebView.loadUrl("file:///android_asset/index.html");\nsetContentView(webView);\n}\n}\n')lient());\nwebView.loadUrl(\"file:///android_asset/index.html\");\n}\n}\n')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/C-Code-Lab.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-Code-Lab-Android-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
